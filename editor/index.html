<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
 <title>Ranch - Editor</title>
</head>
<body>
<button id="zipBtn">Make ZIP</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
document.getElementById("zipBtn").onclick = async () => {
  const zip = new JSZip();

  // Add files
  zip.file("project.json", "{
  "id": "michael-ranch",
  "engine": "RanchEngine",
  "version": "1.0.0",
  "entry": "main.js",
  "files": {
    "scripts": ["resolutions.js"],
    "assets": ["hello.txt", "torch.gif"],
    "data": ["ranch.json"]
  },
  "config": {
    "fullscreen": false,
    "resolution": [1280, 720]
  }
}");

  // Add folder + file
  const assets = zip.folder("assets");
  assets.file("README.md", "Blank Project");

  // Build ZIP
  const blob = await zip.generateAsync({ type: "blob" });

  // Download ZIP
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "project.ranch";
  a.click();
};
</script>
